<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VoiceTally</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 320px;
      padding: 15px;
      background-color: #f9f9f9;
    }
    h2 {
      margin-top: 0;
      color: #333;
      font-size: 18px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input[type="text"] {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #0056b3;
    }
    #output {
      margin-top: 20px;
      padding: 10px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 40px;
      font-size: 13px;
      color: #555;
      white-space: pre-wrap; /* Preserves formatting */
    }
    .error {
      color: #d9534f;
      border-color: #d9534f !important;
    }
  </style>
</head>
<body>

  <h2>VoiceTally MVP</h2>

  <div class="input-group">
    <input type="text" id="queryInput" placeholder="Ask e.g., 'sales last week'..." maxlength="200">
    <button id="submitBtn">Ask Tally</button>
  </div>

  <div id="output">Results will appear here...</div>

  <script src="popup.js"></script>
</body>
</html>
